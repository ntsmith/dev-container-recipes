log-pipeline:
  source:
    http:
      port: 2021
      path: "/log/ingest"
  processor:
    - date:
        from_time_received: true
        destination: "@timestamp"
  sink:
    - opensearch:
        hosts: ["http://opensearch:9200"]
        index: "logs-%{yyyy.MM.dd}"
        insecure: true

metrics-pipeline:
  source:
    http:
      port: 2021
      path: "/metrics/ingest"
  sink:
    - opensearch:
        hosts: ["http://opensearch:9200"]
        index: "metrics-%{yyyy.MM.dd}"
        insecure: true
